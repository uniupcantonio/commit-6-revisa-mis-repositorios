<mat-toolbar>
  <img [src]="logoUrl" [alt]="'app.logo-alt' | translate" width="40" height="40" />
  <span>{{ 'app.title' | translate }}</span>
  <span class="spacer"></span>
  <app-language-switcher />
</mat-toolbar>
<mat-sidenav-container>
  <mat-sidenav mode="side" opened>
    <mat-nav-list aria-label="Navigation options">
      @for (option of options(); track option.link) {
        <a mat-list-item [routerLink]="option.link" routerLinkActive="active">{{
          option.label | translate
        }}</a>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
